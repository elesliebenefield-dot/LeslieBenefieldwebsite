<!DOCTYPE html>
<html lang="en">
<head><title>Reveal past the readiness bound</title></head>
<body>
  <!-- Unlike reveal-within-readiness-bound.html's evidenced real-world
       3.5s delay, this fixture reveals content well PAST the 5000ms
       CONTENT_READINESS_TIMEOUT_MS bound (see captureService.ts) —
       proving the opposite, equally important property: the capture
       must still complete promptly and return an honest "unverified"
       readability result and no found links — not hang, not crash, not
       fabricate a pass — while overflow (which never depends on text or
       links being present, only on document/viewport width) still
       returns a real measurement. This is not a bug: it is the
       documented, intentional behavior of a bounded wait for content
       whose real-world reveal time varies and can genuinely exceed any
       fixed, evidenced bound.

       Links are built via DOM APIs (createElement/setAttribute), not an
       innerHTML string literal — an anchor-tag-shaped source substring
       anywhere in this document (including inside a comment or the
       script's own source text) would otherwise be matched by
       extractLinks' regex directly against the captured HTML, producing
       a false "link found" independent of whether the real DOM ever
       actually revealed it. Deliberately no example of that shape
       appears anywhere in this file, including in this comment. -->
  <main id="content" style="display: none; max-width: 380px;">
    <h1 style="font-size: 24px;">Welcome</h1>
    <p style="font-size: 16px;">This content is revealed well after the readiness bound has already elapsed.</p>
  </main>
  <nav id="nav" style="display: none;"></nav>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('content').style.display = 'block'
        var nav = document.getElementById('nav')
        nav.style.display = 'block'
        ;['about', 'services', 'pricing'].forEach(function (slug) {
          var a = document.createElement('a')
          a.setAttribute('href', '/' + slug)
          a.textContent = slug
          nav.appendChild(a)
        })
      }, 6000)
    })
  </script>
</body>
</html>
