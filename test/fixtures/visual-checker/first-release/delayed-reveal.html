<!DOCTYPE html>
<html lang="en">
<head><title>Delayed reveal</title></head>
<body>
  <!-- Simulates a common theme/plugin "hide until ready" pattern: real
       content is present in the DOM at 'load' time but stays hidden
       until a short JS delay past 'load' finishes, matching how some
       WordPress themes/optimizer plugins reveal content after the
       'load' event rather than before it. -->
  <main id="content" style="display: none; max-width: 380px;">
    <h1 style="font-size: 24px;">Welcome</h1>
    <p style="font-size: 16px;">This content is revealed shortly after the page finishes loading.</p>
  </main>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('content').style.display = 'block'
      }, 300)
    })
  </script>
</body>
</html>
