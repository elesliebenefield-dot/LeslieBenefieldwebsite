    <!-- "Boutique bakery classic" typography, chosen by Leslie after a
         three-way visual comparison (see design.md's Typography section):
         Libre Caslon Display for the product title and major headings,
         Karla for all interface text and figures, and Libre Caslon Text
         (italic only) for the single "Priced with confidence." accent line
         — Display has no italic cut of its own, so the accent borrows its
         companion text face rather than a mismatched font. Neither Syne,
         Lora, nor Sacramento is requested by this page anymore. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@1,400&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
