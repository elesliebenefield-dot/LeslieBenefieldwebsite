<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="A free calculator that helps home bakers find their true recipe cost — ingredients, labor, packaging, waste, and overhead — and a confident selling price. No account, no ads, nothing leaves your device." />
    <title>Free Home Bakery Pricing Calculator</title>
    <link rel="canonical" href="https://websitesbyleslie.com/tools-bakery-pricing" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- WebApplication structured data (M7-8): describes the tool accurately
         as a free web application for search engines. The "offers" node's
         price: "0" is free-tool metadata only, never a payment feature —
         this page stays noindex, nofollow until explicit separate approval
         to publish, so this has no effect until that happens. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Free Home Bakery Pricing Calculator",
        "description": "A free, local-first calculator that helps home bakers find their true recipe cost — ingredients, labor, packaging, waste, and overhead — and a confident selling price. No account required; nothing leaves your device.",
        "url": "https://websitesbyleslie.com/tools-bakery-pricing",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- "Boutique bakery classic" typography, chosen by Leslie after a
         three-way visual comparison (see design.md's Typography section):
         Libre Caslon Display for the product title and major headings,
         Karla for all interface text and figures, and Libre Caslon Text
         (italic only) for the single "Priced with confidence." accent line
         — Display has no italic cut of its own, so the accent borrows its
         companion text face rather than a mismatched font. Neither Syne,
         Lora, nor Sacramento is requested by this page anymore. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@1,400&family=Karla:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="tools-bakery-pricing-root"></div>
    <script type="module" src="/src/tools-bakery-pricing-main.tsx"></script>
  </body>
</html>
